# ⚠️ 스포일러 — 실습 정답이 들어 있는 파일이다. 랩을 풀기 전에는 열지 말 것.
# 이 파일은 어떤 README 에서도 링크하지 않는다.
#
# 규칙
# - id: DF-### 순번. 유형을 드러내지 않는다. 한 번 쓴 ID는 재사용하지 않는다.
# - 코드에서는 isDefectOn('<id>') 한 곳에서만 분기한다 (location).
# - modules: QA-Lab 모듈 slug (data/qa-lab-modules.snapshot.json 에 있어야 함)
# - severity: S1 치명(서비스 불가·보안·데이터 손실) / S2 높음(금전·핵심 기능 오류) / S3 보통(우회 가능) / S4 낮음(표시·경미)
# - repro: SPEC 대로의 "기대 동작"을 적은 재현 절차(DSL). 결함이 켜지면 이 절차의 기대가 실패해야 한다.
#   DSL: login(시드 회원 이메일로 로그인 → 이후 요청에 토큰 사용), http(요청), expect(status / json 경로별 값),
#        save(응답 json 경로를 변수로 저장), {{변수}} 치환.
#   모든 repro 는 실행 전에 DB를 초기화한다(/__admin/reset).
schemaVersion: 1
defects:
  - id: DF-001
    type: boundary
    severity: S3
    surface: api
    modules: [test-design, exploratory-testing]
    location: apps/shop/api/src/domain/shipping.ts
    spec: SPEC §5
    repro:
      steps:
        - login: kim@example.com
        - http: { method: POST, path: /api/quote, json: { items: [{ productId: 1, qty: 1 }] } }
          expect: { status: 200, json: { subtotal: 50000, shippingFee: 0, total: 50000 } }

  - id: DF-002
