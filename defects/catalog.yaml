        - http: { method: PUT, path: /api/cart/items/1, json: { qty: 1 } }
          expect: { status: 200 }
        - http: { method: POST, path: /api/orders, json: { couponCode: WELCOME3000 } }
          expect: { status: 201 }
        - http: { method: PUT, path: /api/cart/items/2, json: { qty: 1 } }
          expect: { status: 200 }
        - http: { method: POST, path: /api/orders, json: { couponCode: WELCOME3000 } }
          expect: { status: 422, json: { code: COUPON_NOT_APPLICABLE, details.reason: ALREADY_USED } }

  - id: DF-010
    type: hidden-variable
    severity: S3
    surface: api
    modules: [test-design, exploratory-testing]
    location: apps/shop/api/src/domain/calendar.ts
