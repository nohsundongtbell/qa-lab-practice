        - http: { method: POST, path: /api/orders, json: {} }
          expect: { status: 201 }
          save: { orderId: id }
        - http: { method: POST, path: '/api/orders/{{orderId}}/cancel' }
          expect: { status: 200, json: { status: CANCELLED } }
        - http: { method: GET, path: /api/products/10 }
          expect: { status: 200, json: { stock: 1 } }

  - id: DF-009
    type: data-integrity
    severity: S2
