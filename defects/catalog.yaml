            json: { name: 김수한무거북이와두루미, email: new-member@example.com, password: password123, zipcode: '06236' }
          expect: { status: 201, json: { name: 김수한무거북이와두루미 } }

  - id: DF-006
    type: boundary
    severity: S2
    surface: api
    modules: [test-design, defect-management]
    location: apps/shop/api/src/domain/coupon.ts
    spec: SPEC §4 정률 쿠폰 최대 할인액
    repro:
      steps:
        - login: kim@example.com
        - http: { method: POST, path: /api/quote, json: { items: [{ productId: 6, qty: 1 }], couponCode: SALE10 } }
          expect: { status: 200, json: { subtotal: 89000, couponDiscount: 5000 } }

  - id: DF-007
    type: state-transition
    severity: S2
    surface: api
    modules: [test-design, exploratory-testing]
    location: apps/shop/api/src/domain/order-state.ts
    spec: SPEC §7.1
    repro:
      steps:
        - login: kim@example.com
        - http: { method: PUT, path: /api/cart/items/2, json: { qty: 1 } }
          expect: { status: 200 }
        - http: { method: POST, path: /api/orders, json: {} }
          expect: { status: 201 }
          save: { orderId: id }
        - http: { method: POST, path: '/api/orders/{{orderId}}/pay', json: { cardNumber: 4111-1111-1111-1111 } }
          expect: { status: 200, json: { status: PAID } }
        - login: admin@example.com
        - http: { method: POST, path: '/api/admin/orders/{{orderId}}/ship' }
          expect: { status: 200, json: { status: SHIPPED } }
        - login: kim@example.com
        - http: { method: POST, path: '/api/orders/{{orderId}}/cancel' }
          expect: { status: 409, json: { code: INVALID_STATE_TRANSITION } }

  - id: DF-008
    type: data-integrity
    severity: S2
    surface: api
    modules: [exploratory-testing, data-checking-sql-logs-analytics]
    location: apps/shop/api/src/routes/shop.ts
    spec: SPEC §7.4 취소 시 재고 복원
    repro:
      steps:
        - login: kim@example.com
        - http: { method: PUT, path: /api/cart/items/10, json: { qty: 1 } }
