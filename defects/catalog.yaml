          expect: { status: 200, json: { subtotal: 4990, gradeDiscount: 49 } }

  - id: DF-012
    type: data-integrity
    severity: S1
    surface: api
    modules: [exploratory-testing, data-checking-sql-logs-analytics]
    location: apps/shop/api/src/routes/shop.ts
    spec: SPEC §7.2 저장된 결제 금액
    repro:
      steps:
        - login: kim@example.com
        - http: { method: PUT, path: /api/cart/items/1, json: { qty: 1 } }
          expect: { status: 200 }
        - http: { method: POST, path: /api/orders, json: { couponCode: WELCOME3000 } }
          expect: { status: 201, json: { couponDiscount: 3000, shippingFee: 3000, total: 50000 } }
          save: { orderId: id }
        - http: { method: GET, path: '/api/orders/{{orderId}}' }
          expect: { status: 200, json: { total: 50000 } }
