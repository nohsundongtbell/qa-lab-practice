  - id: DF-005
    type: i18n
    severity: S2
    surface: api
    modules: [test-design, defect-management, exploratory-testing]
    location: apps/shop/api/src/domain/validation.ts
    spec: SPEC §1.1 이름 글자 수
    repro:
      steps:
        - http:
            method: POST
