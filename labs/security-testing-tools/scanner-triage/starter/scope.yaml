# 허가·범위 체크리스트 — 보안 실습을 시작하기 전에 직접 읽고 채우세요.
# 이 파일이 통과해야 t2(리포트 분류)를 채점합니다.

tester: ""        # 진행자 이름
date: ""          # 오늘 날짜 YYYY-MM-DD

# 이 실습의 대상. 내 컴퓨터 주소(127.0.0.1, localhost)나 이 저장소의 실습 코드 경로만 쓸 수 있습니다.
#   예: labs/security-testing-tools/scanner-triage/work/scan-target   http://127.0.0.1:9000
targets:
  - ""

# 모두 읽고, 동의하면 true 로 바꾸세요.
authorization:
  own_environment: false   # 대상은 내 컴퓨터에서 내가 띄운 실습 앱·실습 코드뿐이다
  no_third_party: false    # 다른 사람·회사의 시스템과 공개 인터넷 주소는 대상이 아니다
  no_real_data: false      # 실제 개인정보·비밀 값을 쓰거나 모으지 않는다
  stop_on_doubt: false     # 범위가 애매하면 멈추고 확인한다

# 하지 않을 것 (1개 이상)
out_of_scope:
  - ""
