module: ui-automation
lessons: [getting-started-with-playwright, resilient-locators, page-object-model, wait-strategies, taming-flaky-ui-tests, api-fixture-test-data]
title_ko: QA 숍 화면을 Playwright 로 안정적으로 자동화하기
level: beginner
est_minutes: 180
requires: [docker, node24]
platforms: [macos, windows, linux]
notes: ""
tools: [playwright]
sut_profile: none
tasks:
  - id: t1
    goal: 로그인부터 주문까지의 구매 흐름과 로그인 실패 메시지를 Playwright 테스트로 자동화한다
    check: check/t1.mjs
    pass: { min_tests: 2 }
  - id: t2
    goal: 사용자가 보는 이름과 역할로 찾는 로케이터를 써서 화면 구조가 바뀌어도(v2) 통과하는 테스트를 작성한다
    check: check/t2.mjs
    pass: { min_tests: 2, variants: [v1, v2] }
  - id: t3
    goal: 페이지 객체와 조건 기반 대기로 응답이 불안정한 환경에서도 10번 반복해 모두 통과하는 테스트를 만든다
    check: check/t3.mjs
    pass: { min_tests: 2, latency: unstable, repeat: 10 }
  - id: t4
    goal: fixture API 로 테스트 데이터를 만들어 배송 완료 주문의 환불 흐름을 독립적인 테스트로 검증한다
    check: check/t4.mjs
    pass: { min_tests: 2, repeat: 2 }
status: ready
