server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API 는 같은 출처로 프록시한다 (CORS 불필요)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
