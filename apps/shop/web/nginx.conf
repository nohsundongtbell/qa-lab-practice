server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API 는 같은 출처로 프록시한다 (CORS 불필요)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  # 웹이 시작할 때 환경 조건(UI 변형·지연)을 읽는 경로 — 이 경로 하나만 API 로 전달한다
  location = /__qa/environment {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
